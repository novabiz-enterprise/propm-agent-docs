<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Annotated ProPM Agent dashboard</title>
  <desc id="desc">Annotated screenshot showing active project, metrics, recent activity, shortcuts and health.</desc>
  <rect width="1200" height="720" fill="#0f172a"/>
  <image href="/img/screenshots/localized/en/01-dashboard.jpg" x="0" y="0" width="1200" height="720" preserveAspectRatio="xMidYMid slice" opacity="0.78"/>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="30" y="24" width="330" height="54" rx="10" fill="#2563eb" opacity="0.95"/><text x="48" y="59" fill="white">1 Active project</text>
    <line x1="360" y1="52" x2="650" y2="70" stroke="#2563eb" stroke-width="5"/>
    <rect x="58" y="150" width="360" height="54" rx="10" fill="#16a34a" opacity="0.95"/><text x="76" y="185" fill="white">2 Project metrics</text>
    <line x1="418" y1="177" x2="705" y2="210" stroke="#16a34a" stroke-width="5"/>
    <rect x="52" y="548" width="370" height="54" rx="10" fill="#ea580c" opacity="0.95"/><text x="70" y="583" fill="white">3 Recent activity</text>
    <line x1="422" y1="575" x2="760" y2="585" stroke="#ea580c" stroke-width="5"/>
    <rect x="742" y="95" width="385" height="54" rx="10" fill="#7c3aed" opacity="0.95"/><text x="760" y="130" fill="white">4 Action shortcuts</text>
    <line x1="934" y1="149" x2="1000" y2="250" stroke="#7c3aed" stroke-width="5"/>
    <rect x="805" y="24" width="330" height="54" rx="10" fill="#dc2626" opacity="0.95"/><text x="823" y="59" fill="white">5 Health and alerts</text>
    <line x1="970" y1="78" x2="1120" y2="55" stroke="#dc2626" stroke-width="5"/>
  </g>
</svg>
