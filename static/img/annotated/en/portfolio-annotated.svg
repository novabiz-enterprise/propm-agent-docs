    <line x1="920" y1="134" x2="980" y2="250" stroke="#7c3aed" stroke-width="5"/>
    <rect x="750" y="562" width="380" height="50" rx="10" fill="#dc2626" opacity="0.95"/><text x="768" y="595" fill="white">5 Outliers and evidence</text>
    <line x1="940" y1="562" x2="930" y2="470" stroke="#dc2626" stroke-width="5"/>
  </g>
</svg>
