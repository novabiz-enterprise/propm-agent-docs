<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Workflow de revue Portfolio</title>
  <desc id="desc">Schéma expliquant sélection projets, profil de signaux, cohortes, seuil outlier, revue des preuves et actions de suite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Arial,sans-serif;fill:#475569}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{font:700 22px Arial,sans-serif;fill:#0f172a}.body{font:400 17px Arial,sans-serif;fill:#475569}.step{font:700 18px Arial,sans-serif;fill:#fff}.note{font:700 20px Arial,sans-serif;fill:#14532d}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="72" class="title">Workflow de revue Portfolio</text>
  <text x="60" y="108" class="subtitle">Comparez les projets après validation de la sélection, du profil, du seuil et de la qualité des preuves.</text>

  <rect x="65" y="155" width="250" height="150" rx="22" class="card"/>
  <circle cx="103" cy="195" r="24" fill="#2563eb"/><text x="96" y="202" class="step">1</text>
  <text x="140" y="198" class="head">Sélection projets</text>
  <text x="103" y="242" class="body">Choisissez portefeuille,</text>
  <text x="103" y="267" class="body">périmètre et projets</text>
  <text x="103" y="292" class="body">à comparer.</text>

  <rect x="365" y="155" width="250" height="150" rx="22" class="card"/>
  <circle cx="403" cy="195" r="24" fill="#16a34a"/><text x="396" y="202" class="step">2</text>
  <text x="440" y="198" class="head">Profil signaux</text>
  <text x="403" y="242" class="body">Choisissez les signaux</text>
  <text x="403" y="267" class="body">utiles : risque, délai,</text>
  <text x="403" y="292" class="body">preuves et blocages.</text>

  <rect x="665" y="155" width="250" height="150" rx="22" class="card"/>
  <circle cx="703" cy="195" r="24" fill="#7c3aed"/><text x="696" y="202" class="step">3</text>
  <text x="740" y="198" class="head">Cohortes</text>
  <text x="703" y="242" class="body">Regroupez les projets</text>
  <text x="703" y="267" class="body">comparables avant de</text>
  <text x="703" y="292" class="body">lire les outliers.</text>

  <rect x="955" y="155" width="190" height="150" rx="22" class="card"/>
  <circle cx="993" cy="195" r="24" fill="#ea580c"/><text x="986" y="202" class="step">4</text>
  <text x="1028" y="198" class="head">Seuil</text>
  <text x="993" y="242" class="body">Réglez la</text>
  <text x="993" y="267" class="body">sensibilité de</text>
  <text x="993" y="292" class="body">classement.</text>

  <rect x="250" y="405" width="300" height="150" rx="22" class="card"/>
  <circle cx="288" cy="445" r="24" fill="#dc2626"/><text x="281" y="452" class="step">5</text>
  <text x="325" y="448" class="head">Outliers et preuves</text>
  <text x="288" y="492" class="body">Inspectez les écarts</text>
  <text x="288" y="517" class="body">les plus forts et leurs</text>
  <text x="288" y="542" class="body">preuves associées.</text>

  <rect x="650" y="405" width="300" height="150" rx="22" class="card"/>
  <circle cx="688" cy="445" r="24" fill="#0f766e"/><text x="681" y="452" class="step">6</text>
  <text x="725" y="448" class="head">Décision de suite</text>
  <text x="688" y="492" class="body">Ouvrez le projet, créez</text>
  <text x="688" y="517" class="body">une action de revue ou</text>
  <text x="688" y="542" class="body">préparez un Document PM.</text>

  <line x1="317" y1="230" x2="357" y2="230" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="617" y1="230" x2="657" y2="230" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="917" y1="230" x2="947" y2="230" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1025" y1="310" x2="405" y2="398" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="552" y1="480" x2="642" y2="480" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="265" y="615" width="670" height="58" rx="18" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="600" y="651" text-anchor="middle" class="note">Un outlier est une priorité de revue, pas une conclusion automatique</text>
</svg>
