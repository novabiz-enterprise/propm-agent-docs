<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">Parcours vertical de relecture d'une sortie structurée</title>
  <desc id="desc">Schéma vertical montrant les étapes successives pour relire une sortie structurée : résumé, décisions, preuves, fraîcheur, confiance, informations manquantes, actions aval et validation humaine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L13,1 L7,13 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Arial,sans-serif;fill:#475569}.rail{stroke:#bfdbfe;stroke-width:8;stroke-linecap:round}.flow{stroke:#2563eb;stroke-width:5;stroke-linecap:round;marker-end:url(#arrow)}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.action-card{fill:url(#action);stroke:#2563eb;stroke-width:3;filter:url(#shadow)}.num{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle}.head{font:700 23px Arial,sans-serif;fill:#0f172a}.body{font:400 18px Arial,sans-serif;fill:#475569}.small{font:700 14px Arial,sans-serif;fill:#0f172a}.pill{fill:#e0f2fe;stroke:#93c5fd;stroke-width:1}.final{font:700 23px Arial,sans-serif;fill:#fff;text-anchor:middle}.final-sub{font:400 16px Arial,sans-serif;fill:#cbd5e1;text-anchor:middle}
    </style>
  </defs>

  <rect width="1200" height="1080" rx="30" fill="url(#bg)"/>
  <text x="60" y="64" class="title">Relire une sortie structurée avant réutilisation</text>
  <text x="60" y="100" class="subtitle">Suivez les étapes dans l'ordre : chaque sortie IA reste un brouillon tant que la relecture humaine n'est pas terminée.</text>

  <line x1="92" y1="150" x2="92" y2="910" class="rail"/>

  <line x1="92" y1="208" x2="92" y2="266" class="flow"/>
  <line x1="92" y1="318" x2="92" y2="376" class="flow"/>
  <line x1="92" y1="428" x2="92" y2="486" class="flow"/>
  <line x1="92" y1="538" x2="92" y2="596" class="flow"/>
  <line x1="92" y1="648" x2="92" y2="706" class="flow"/>
  <line x1="92" y1="758" x2="92" y2="816" class="flow"/>
  <line x1="92" y1="884" x2="92" y2="930" class="flow"/>

  <circle cx="92" cy="185" r="30" fill="#2563eb"/><text x="92" y="193" class="num">1</text>
  <rect x="150" y="140" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="176" class="head">Résumé et constats</text>
  <text x="185" y="207" class="body">Lisez le message principal, puis distinguez les faits vérifiables de l'interprétation IA.</text>

  <circle cx="92" cy="295" r="30" fill="#16a34a"/><text x="92" y="303" class="num">2</text>
  <rect x="150" y="250" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="286" class="head">Décisions à prendre</text>
  <text x="185" y="317" class="body">Repérez ce qui demande approbation, arbitrage, revue projet ou validation d'un responsable.</text>

  <circle cx="92" cy="405" r="30" fill="#ea580c"/><text x="92" y="413" class="num">3</text>
  <rect x="150" y="360" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="396" class="head">Preuves et citations</text>
  <text x="185" y="427" class="body">Ouvrez les sources citées et vérifiez qu'elles soutiennent réellement la conclusion.</text>

  <circle cx="92" cy="515" r="30" fill="#7c3aed"/><text x="92" y="523" class="num">4</text>
  <rect x="150" y="470" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="506" class="head">Fraîcheur</text>
  <text x="185" y="537" class="body">Classez les informations avant usage :</text>
  <rect x="500" y="513" width="76" height="30" rx="15" class="pill"/><text x="538" y="533" class="small" text-anchor="middle">Récent</text>
  <rect x="588" y="513" width="110" height="30" rx="15" class="pill"/><text x="643" y="533" class="small" text-anchor="middle">Vieillissant</text>
  <rect x="710" y="513" width="76" height="30" rx="15" class="pill"/><text x="748" y="533" class="small" text-anchor="middle">Ancien</text>
  <rect x="798" y="513" width="76" height="30" rx="15" class="pill"/><text x="836" y="533" class="small" text-anchor="middle">Conflit</text>

  <circle cx="92" cy="625" r="30" fill="#0f766e"/><text x="92" y="633" class="num">5</text>
  <rect x="150" y="580" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="616" class="head">Confiance</text>
  <text x="185" y="647" class="body">Utilisez le score comme un signal de priorisation, jamais comme une approbation automatique.</text>

  <circle cx="92" cy="735" r="30" fill="#dc2626"/><text x="92" y="743" class="num">6</text>
  <rect x="150" y="690" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="726" class="head">Informations manquantes</text>
  <text x="185" y="757" class="body">Complétez la connaissance, demandez une source ou gardez la réponse en exploration.</text>

  <circle cx="92" cy="850" r="32" fill="#1d4ed8"/><text x="92" y="858" class="num">7</text>
  <rect x="150" y="800" width="990" height="100" rx="24" class="action-card"/>
  <text x="185" y="838" class="head">Actions aval</text>
  <text x="185" y="870" class="body">Choisissez seulement après vérification : Document PM, Journal IA, action d'approbation ou suivi projet.</text>

  <rect x="150" y="940" width="990" height="92" rx="26" fill="#0f172a" filter="url(#shadow)"/>
  <text x="645" y="980" class="final">Relecture humaine obligatoire avant publication</text>
  <text x="645" y="1010" class="final-sub">Aucune sortie IA ne doit devenir un livrable final sans contrôle des preuves, du contexte et de la décision.</text>
</svg>
