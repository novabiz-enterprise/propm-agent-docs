<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Schéma de relecture d'une sortie structurée</title>
  <desc id="desc">Schéma montrant comment relire résumé, constats, décisions, preuves, fraîcheur, confiance, informations manquantes et actions aval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Arial,sans-serif;fill:#475569}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.num{font:700 20px Arial,sans-serif;fill:#fff}.head{font:700 22px Arial,sans-serif;fill:#0f172a}.body{font:400 17px Arial,sans-serif;fill:#475569}.pill{font:700 14px Arial,sans-serif;fill:#0f172a}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" class="title">Relire une sortie structurée avant réutilisation</text>
  <text x="60" y="105" class="subtitle">Les preuves et le jugement humain décident si la réponse devient Document PM, action ou élément d'audit.</text>

  <rect x="60" y="150" width="320" height="150" rx="22" class="card"/>
  <circle cx="95" cy="190" r="23" fill="#2563eb"/><text x="88" y="197" class="num">1</text>
  <text x="130" y="190" class="head">Résumé et constats</text>
  <text x="95" y="230" class="body">Lisez le message principal,</text>
  <text x="95" y="255" class="body">puis séparez les faits</text>
  <text x="95" y="280" class="body">de l'interprétation IA.</text>

  <rect x="440" y="150" width="320" height="150" rx="22" class="card"/>
  <circle cx="475" cy="190" r="23" fill="#16a34a"/><text x="468" y="197" class="num">2</text>
  <text x="510" y="190" class="head">Décisions à prendre</text>
  <text x="475" y="230" class="body">Repérez ce qui demande</text>
  <text x="475" y="255" class="body">approbation, arbitrage</text>
  <text x="475" y="280" class="body">ou revue projet.</text>

  <rect x="820" y="150" width="320" height="150" rx="22" class="card"/>
  <circle cx="855" cy="190" r="23" fill="#ea580c"/><text x="848" y="197" class="num">3</text>
  <text x="890" y="190" class="head">Preuves et citations</text>
  <text x="855" y="230" class="body">Ouvrez les sources citées</text>
  <text x="855" y="255" class="body">et vérifiez qu'elles</text>
  <text x="855" y="280" class="body">justifient la conclusion.</text>

  <line x1="382" y1="225" x2="432" y2="225" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="762" y1="225" x2="812" y2="225" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="375" width="245" height="170" rx="22" class="card"/>
  <circle cx="95" cy="415" r="23" fill="#7c3aed"/><text x="88" y="422" class="num">4</text>
  <text x="130" y="415" class="head">Fraîcheur</text>
  <rect x="92" y="450" width="70" height="30" rx="15" fill="#d1fae5"/><text x="108" y="470" class="pill">Récent</text>
  <rect x="170" y="450" width="92" height="30" rx="15" fill="#fef3c7"/><text x="184" y="470" class="pill">Vieillissant</text>
  <rect x="92" y="490" width="72" height="30" rx="15" fill="#fee2e2"/><text x="110" y="510" class="pill">Ancien</text>
  <rect x="172" y="490" width="100" height="30" rx="15" fill="#ede9fe"/><text x="186" y="510" class="pill">Conflit</text>

  <rect x="345" y="375" width="245" height="170" rx="22" class="card"/>
  <circle cx="380" cy="415" r="23" fill="#0f766e"/><text x="373" y="422" class="num">5</text>
  <text x="415" y="415" class="head">Confiance</text>
  <text x="380" y="458" class="body">Utilisez-la comme</text>
  <text x="380" y="483" class="body">un signal, jamais</text>
  <text x="380" y="508" class="body">comme une approbation.</text>

  <rect x="630" y="375" width="245" height="170" rx="22" class="card"/>
  <circle cx="665" cy="415" r="23" fill="#dc2626"/><text x="658" y="422" class="num">6</text>
  <text x="700" y="415" class="head">Infos manquantes</text>
  <text x="665" y="458" class="body">Complétez la connaissance,</text>
  <text x="665" y="483" class="body">demandez une source</text>
  <text x="665" y="508" class="body">ou gardez en exploration.</text>

  <rect x="915" y="375" width="225" height="170" rx="22" class="card"/>
  <circle cx="950" cy="415" r="23" fill="#1d4ed8"/><text x="943" y="422" class="num">7</text>
  <text x="985" y="415" class="head">Actions aval</text>
  <text x="950" y="458" class="body">Document PM</text>
  <text x="950" y="483" class="body">Journal IA</text>
  <text x="950" y="508" class="body">Approbation</text>

  <line x1="975" y1="548" x2="975" y2="608" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="270" y="610" width="660" height="60" rx="20" fill="#0f172a"/>
  <text x="325" y="648" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Relecture humaine obligatoire avant publication</text>
</svg>
