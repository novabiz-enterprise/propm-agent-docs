<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sortie structurée annotée</title>
  <desc id="desc">Capture annotée montrant résumé, décisions, preuves, fraîcheur, confiance et actions aval.</desc>
  <rect width="1200" height="720" fill="#111827"/>
  <image href="/img/screenshots/localized/fr/03-workspace-structured-output.jpg" x="0" y="0" width="1200" height="720" preserveAspectRatio="xMidYMid slice" opacity="0.78"/>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700">
    <rect x="36" y="38" width="260" height="50" rx="10" fill="#2563eb" opacity="0.95"/><text x="54" y="71" fill="white">1 Résumé</text>
    <line x1="296" y1="63" x2="565" y2="128" stroke="#2563eb" stroke-width="5"/>
    <rect x="38" y="140" width="310" height="50" rx="10" fill="#16a34a" opacity="0.95"/><text x="56" y="173" fill="white">2 Décisions</text>
    <line x1="348" y1="165" x2="640" y2="260" stroke="#16a34a" stroke-width="5"/>
    <rect x="45" y="560" width="310" height="50" rx="10" fill="#ea580c" opacity="0.95"/><text x="63" y="593" fill="white">3 Preuves</text>
    <line x1="355" y1="585" x2="730" y2="585" stroke="#ea580c" stroke-width="5"/>
    <rect x="776" y="76" width="360" height="50" rx="10" fill="#7c3aed" opacity="0.95"/><text x="794" y="109" fill="white">4 Fraîcheur / confiance</text>
    <line x1="955" y1="126" x2="990" y2="350" stroke="#7c3aed" stroke-width="5"/>
    <rect x="770" y="606" width="360" height="50" rx="10" fill="#dc2626" opacity="0.95"/><text x="788" y="639" fill="white">5 Actions aval</text>
    <line x1="945" y1="606" x2="930" y2="515" stroke="#dc2626" stroke-width="5"/>
  </g>
</svg>
