<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">Workflow vertical d'administration du fournisseur IA</title>
  <desc id="desc">Schéma vertical montrant le choix du fournisseur, la configuration, Save, Validate, Test, Activate, la vérification dans le Journal IA et la règle de protection des secrets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L13,1 L7,13 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Arial,sans-serif;fill:#475569}.rail{stroke:#bfdbfe;stroke-width:8;stroke-linecap:round}.flow{stroke:#2563eb;stroke-width:5;stroke-linecap:round;marker-end:url(#arrow)}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.active-card{fill:url(#active);stroke:#2563eb;stroke-width:3;filter:url(#shadow)}.num{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle}.head{font:700 23px Arial,sans-serif;fill:#0f172a}.body{font:400 18px Arial,sans-serif;fill:#475569}.final{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.final-sub{font:400 16px Arial,sans-serif;fill:#cbd5e1;text-anchor:middle}
    </style>
  </defs>

  <rect width="1200" height="1040" rx="30" fill="url(#bg)"/>
  <text x="60" y="64" class="title">Paramètres du fournisseur IA</text>
  <text x="60" y="100" class="subtitle">Suivez la séquence d'administration : une configuration IA n'est fiable qu'après validation, test et activation contrôlée.</text>

  <line x1="92" y1="150" x2="92" y2="850" class="rail"/>
  <line x1="92" y1="198" x2="92" y2="246" class="flow"/>
  <line x1="92" y1="298" x2="92" y2="346" class="flow"/>
  <line x1="92" y1="398" x2="92" y2="446" class="flow"/>
  <line x1="92" y1="498" x2="92" y2="546" class="flow"/>
  <line x1="92" y1="598" x2="92" y2="646" class="flow"/>
  <line x1="92" y1="698" x2="92" y2="746" class="flow"/>
  <line x1="92" y1="812" x2="92" y2="868" class="flow"/>

  <circle cx="92" cy="175" r="30" fill="#2563eb"/><text x="92" y="183" class="num">1</text>
  <rect x="150" y="130" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="166" class="head">Type de fournisseur</text>
  <text x="185" y="197" class="body">Choisissez Azure OpenAI, OpenAI-compatible, OpenRouter ou un fournisseur autorisé.</text>

  <circle cx="92" cy="275" r="30" fill="#16a34a"/><text x="92" y="283" class="num">2</text>
  <rect x="150" y="230" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="266" class="head">Configuration</text>
  <text x="185" y="297" class="body">Renseignez endpoint, modèle ou deployment, version API et mode d'authentification.</text>

  <circle cx="92" cy="375" r="30" fill="#ea580c"/><text x="92" y="383" class="num">3</text>
  <rect x="150" y="330" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="366" class="head">Save</text>
  <text x="185" y="397" class="body">Enregistrez les réglages avant de lancer les contrôles techniques.</text>

  <circle cx="92" cy="475" r="30" fill="#7c3aed"/><text x="92" y="483" class="num">4</text>
  <rect x="150" y="430" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="466" class="head">Validate</text>
  <text x="185" y="497" class="body">Vérifiez les champs obligatoires, les formats, la cohérence fournisseur et les prérequis.</text>

  <circle cx="92" cy="575" r="30" fill="#0f766e"/><text x="92" y="583" class="num">5</text>
  <rect x="150" y="530" width="990" height="90" rx="22" class="card"/>
  <text x="185" y="566" class="head">Test</text>
  <text x="185" y="597" class="body">Lancez un contrôle fonctionnel avant activation pour confirmer que le fournisseur répond.</text>

  <circle cx="92" cy="675" r="30" fill="#dc2626"/><text x="92" y="683" class="num">6</text>
  <rect x="150" y="630" width="990" height="90" rx="22" class="active-card"/>
  <text x="185" y="666" class="head">Activate</text>
  <text x="185" y="697" class="body">Activez uniquement la configuration qui a été enregistrée, validée et testée.</text>

  <circle cx="92" cy="785" r="32" fill="#1d4ed8"/><text x="92" y="793" class="num">7</text>
  <rect x="150" y="740" width="990" height="100" rx="24" class="active-card"/>
  <text x="185" y="778" class="head">Journal IA</text>
  <text x="185" y="810" class="body">Confirmez le fournisseur réellement utilisé par les runs et conservez la trace d'audit.</text>

  <rect x="150" y="900" width="990" height="92" rx="26" fill="#0f172a" filter="url(#shadow)"/>
  <text x="645" y="940" class="final">Ne copiez jamais secrets, clés API ou jetons dans un ticket</text>
  <text x="645" y="970" class="final-sub">Utilisez des références sécurisées et contactez le support seulement avec des informations non sensibles.</text>
</svg>
