<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Workflow d'administration du fournisseur IA</title>
  <desc id="desc">Schéma montrant choix fournisseur, configuration, enregistrement, validation, test, activation et vérification dans le Journal IA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Arial,sans-serif;fill:#475569}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{font:700 22px Arial,sans-serif;fill:#0f172a}.body{font:400 17px Arial,sans-serif;fill:#475569}.step{font:700 18px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="72" class="title">Paramètres du fournisseur IA</text>
  <text x="60" y="108" class="subtitle">Configurez le fournisseur de façon sûre, puis vérifiez le fournisseur effectif dans le Journal IA.</text>

  <rect x="60" y="160" width="230" height="155" rx="22" class="card"/>
  <circle cx="95" cy="198" r="24" fill="#2563eb"/><text x="88" y="205" class="step">1</text>
  <text x="130" y="202" class="head">Type fournisseur</text>
  <text x="95" y="245" class="body">Sélectionnez Azure OpenAI,</text>
  <text x="95" y="270" class="body">compatible OpenAI ou</text>
  <text x="95" y="295" class="body">un fournisseur autorisé.</text>

  <rect x="350" y="160" width="250" height="155" rx="22" class="card"/>
  <circle cx="385" cy="198" r="24" fill="#16a34a"/><text x="378" y="205" class="step">2</text>
  <text x="420" y="202" class="head">Configuration</text>
  <text x="385" y="245" class="body">Renseignez endpoint,</text>
  <text x="385" y="270" class="body">modèle, version API et</text>
  <text x="385" y="295" class="body">mode d'authentification.</text>

  <rect x="660" y="160" width="230" height="155" rx="22" class="card"/>
  <circle cx="695" cy="198" r="24" fill="#ea580c"/><text x="688" y="205" class="step">3</text>
  <text x="730" y="202" class="head">Save</text>
  <text x="695" y="245" class="body">Enregistrez les réglages</text>
  <text x="695" y="270" class="body">avant de lancer les</text>
  <text x="695" y="295" class="body">contrôles.</text>

  <rect x="950" y="160" width="190" height="155" rx="22" class="card"/>
  <circle cx="985" cy="198" r="24" fill="#7c3aed"/><text x="978" y="205" class="step">4</text>
  <text x="1020" y="202" class="head">Validate</text>
  <text x="985" y="245" class="body">Vérifiez champs</text>
  <text x="985" y="270" class="body">obligatoires et</text>
  <text x="985" y="295" class="body">cohérence fournisseur.</text>

  <line x1="292" y1="238" x2="342" y2="238" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="602" y1="238" x2="652" y2="238" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="892" y1="238" x2="942" y2="238" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="180" y="405" width="260" height="145" rx="22" class="card"/>
  <circle cx="215" cy="443" r="24" fill="#0f766e"/><text x="208" y="450" class="step">5</text>
  <text x="250" y="447" class="head">Test</text>
  <text x="215" y="490" class="body">Lancez un contrôle</text>
  <text x="215" y="515" class="body">fonctionnel avant activation.</text>

  <rect x="500" y="405" width="260" height="145" rx="22" class="card"/>
  <circle cx="535" cy="443" r="24" fill="#dc2626"/><text x="528" y="450" class="step">6</text>
  <text x="570" y="447" class="head">Activate</text>
  <text x="535" y="490" class="body">Rendez active la</text>
  <text x="535" y="515" class="body">configuration contrôlée.</text>

  <rect x="820" y="405" width="260" height="145" rx="22" class="card"/>
  <circle cx="855" cy="443" r="24" fill="#1d4ed8"/><text x="848" y="450" class="step">7</text>
  <text x="890" y="447" class="head">Journal IA</text>
  <text x="855" y="490" class="body">Confirmez le fournisseur</text>
  <text x="855" y="515" class="body">effectif utilisé par les runs.</text>

  <line x1="1045" y1="318" x2="320" y2="395" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="442" y1="478" x2="492" y2="478" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="762" y1="478" x2="812" y2="478" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="220" y="610" width="760" height="58" rx="18" fill="#0f172a"/>
  <text x="260" y="646" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Ne copiez jamais secrets, clés API ou jetons dans un ticket</text>
</svg>
