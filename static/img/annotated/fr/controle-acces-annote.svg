<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Contrôle d’accès annoté</title>
  <desc id="desc">Capture annotée du contrôle d’accès avec membres, rôles standards, rôles personnalisés et garde-fous.</desc>
  <rect width="1200" height="720" fill="#111827"/>
  <image href="/img/screenshots/localized/fr/11-access-control.jpg" x="0" y="0" width="1200" height="720" preserveAspectRatio="xMidYMid slice" opacity="0.78"/>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700">
    <rect x="35" y="65" width="345" height="50" rx="10" fill="#2563eb" opacity="0.95"/><text x="53" y="98" fill="white">1 Membres</text>
    <line x1="380" y1="90" x2="640" y2="160" stroke="#2563eb" stroke-width="5"/>
    <rect x="38" y="170" width="345" height="50" rx="10" fill="#16a34a" opacity="0.95"/><text x="56" y="203" fill="white">2 Rôles standards</text>
    <line x1="383" y1="195" x2="665" y2="270" stroke="#16a34a" stroke-width="5"/>
    <rect x="42" y="548" width="375" height="50" rx="10" fill="#ea580c" opacity="0.95"/><text x="60" y="581" fill="white">3 Rôles personnalisés</text>
    <line x1="417" y1="573" x2="735" y2="585" stroke="#ea580c" stroke-width="5"/>
    <rect x="735" y="80" width="390" height="50" rx="10" fill="#dc2626" opacity="0.95"/><text x="753" y="113" fill="white">4 Garde-fous RBAC</text>
    <line x1="930" y1="130" x2="980" y2="318" stroke="#dc2626" stroke-width="5"/>
  </g>
</svg>
