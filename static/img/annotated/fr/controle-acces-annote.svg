<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Schéma du contrôle d'accès projet</title>
  <desc id="desc">Schéma montrant membres, rôles standards, rôles personnalisés, garde-fous RBAC et trace d'audit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Arial,sans-serif;fill:#475569}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{font:700 22px Arial,sans-serif;fill:#0f172a}.body{font:400 17px Arial,sans-serif;fill:#475569}.step{font:700 18px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="72" class="title">Contrôle d'accès projet</text>
  <text x="60" y="108" class="subtitle">Attribuez d'abord des rôles métier, puis utilisez les rôles personnalisés seulement si le périmètre l'exige.</text>

  <rect x="70" y="165" width="250" height="160" rx="22" class="card"/>
  <circle cx="105" cy="205" r="24" fill="#2563eb"/><text x="98" y="212" class="step">1</text>
  <text x="140" y="209" class="head">Membres</text>
  <text x="105" y="252" class="body">Ajoutez utilisateurs</text>
  <text x="105" y="277" class="body">ou groupes au projet.</text>

  <rect x="475" y="145" width="250" height="150" rx="22" class="card"/>
  <circle cx="510" cy="185" r="24" fill="#16a34a"/><text x="503" y="192" class="step">2</text>
  <text x="545" y="189" class="head">Rôles standards</text>
  <text x="510" y="232" class="body">Propriétaire, Chef</text>
  <text x="510" y="257" class="body">de projet, Contributeur,</text>
  <text x="510" y="282" class="body">Lecteur, Auditeur.</text>

  <rect x="475" y="380" width="250" height="150" rx="22" class="card"/>
  <circle cx="510" cy="420" r="24" fill="#ea580c"/><text x="503" y="427" class="step">3</text>
  <text x="545" y="424" class="head">Rôles personnalisés</text>
  <text x="510" y="467" class="body">À utiliser quand les</text>
  <text x="510" y="492" class="body">rôles standards sont</text>
  <text x="510" y="517" class="body">trop larges ou étroits.</text>

  <rect x="880" y="165" width="250" height="160" rx="22" class="card"/>
  <circle cx="915" cy="205" r="24" fill="#dc2626"/><text x="908" y="212" class="step">4</text>
  <text x="950" y="209" class="head">Garde-fous RBAC</text>
  <text x="915" y="252" class="body">Évitent auto-blocage,</text>
  <text x="915" y="277" class="body">élévation imprévue</text>
  <text x="915" y="302" class="body">et contournement.</text>

  <rect x="880" y="405" width="250" height="125" rx="22" class="card"/>
  <circle cx="915" cy="443" r="24" fill="#7c3aed"/><text x="908" y="450" class="step">5</text>
  <text x="950" y="447" class="head">Trace d'audit</text>
  <text x="915" y="490" class="body">Conserve qui a changé</text>
  <text x="915" y="515" class="body">l'accès et quand.</text>

  <line x1="322" y1="245" x2="467" y2="220" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="322" y1="245" x2="467" y2="455" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="727" y1="220" x2="872" y2="245" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="727" y1="455" x2="872" y2="468" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="220" y="610" width="760" height="58" rx="18" fill="#0f172a"/>
  <text x="275" y="646" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Si un bouton est grisé, vérifiez rôle, politique et intégration</text>
</svg>
