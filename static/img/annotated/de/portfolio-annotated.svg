<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio-Review-Workflow</title>
  <desc id="desc">Vertikaler Ablauf der Portfolio-Review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="0.55" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,1 L7,13 Z" fill="#16a34a"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>.title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Arial,sans-serif;fill:#475569}.rail{stroke:#bbf7d0;stroke-width:8;stroke-linecap:round}.flow{stroke:#16a34a;stroke-width:5;stroke-linecap:round;marker-end:url(#arrow)}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.action-card{fill:url(#accent);stroke:#16a34a;stroke-width:3;filter:url(#shadow)}.guard-card{fill:#fee2e2;stroke:#dc2626;stroke-width:3;filter:url(#shadow)}.num{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle}.head{font:700 23px Arial,sans-serif;fill:#0f172a}.body{font:400 18px Arial,sans-serif;fill:#475569}.final{font:700 22px Arial,sans-serif;fill:#fff;text-anchor:middle}.final-sub{font:400 16px Arial,sans-serif;fill:#dcfce7;text-anchor:middle}</style>
  </defs>
  <rect width="1200" height="980" rx="30" fill="url(#bg)"/>
  <text x="60" y="64" class="title">Portfolio-Review-Workflow</text>
  <text x="60" y="100" class="subtitle">Vergleichen Sie Projekte erst nach Prüfung von Umfang, Signalprofil, Schwelle und Nachweisen.</text>
  <line x1="92" y1="150" x2="92" y2="790" class="rail"/>

  <circle cx="92" cy="175" r="30" fill="#2563eb"/><text x="92" y="183" class="num">1</text>
  <rect x="150" y="125" width="990" height="100" rx="24" class="card"/>
  <text x="185" y="162" class="head">Projektauswahl</text>
  <text x="185" y="197" class="body">Wählen Sie Portfolio, Umfang und Projekte aus, bevor Sie Kennzahlen lesen.</text>

  <circle cx="92" cy="280" r="30" fill="#16a34a"/><text x="92" y="288" class="num">2</text>
  <rect x="150" y="230" width="990" height="100" rx="24" class="card"/>
  <text x="185" y="267" class="head">Signalprofil</text>
  <text x="185" y="302" class="body">Wählen Sie relevante Signale: Risiko, Zeitplan, Nachweise und Blocker.</text>

  <circle cx="92" cy="385" r="30" fill="#7c3aed"/><text x="92" y="393" class="num">3</text>
  <rect x="150" y="335" width="990" height="100" rx="24" class="card"/>
  <text x="185" y="372" class="head">Kohorten</text>
  <text x="185" y="407" class="body">Gruppieren Sie vergleichbare Projekte, damit Kontexte nicht vermischt werden.</text>

  <circle cx="92" cy="490" r="30" fill="#ea580c"/><text x="92" y="498" class="num">4</text>
  <rect x="150" y="440" width="990" height="100" rx="24" class="card"/>
  <text x="185" y="477" class="head">Ausreißer-Schwelle</text>
  <text x="185" y="512" class="body">Setzen Sie die Sensitivität, bevor Abweichungen priorisiert werden.</text>

  <circle cx="92" cy="595" r="30" fill="#dc2626"/><text x="92" y="603" class="num">5</text>
  <rect x="150" y="545" width="990" height="100" rx="24" class="action-card"/>
  <text x="185" y="582" class="head">Ausreißer und Nachweise</text>
  <text x="185" y="617" class="body">Prüfen Sie starke Abweichungen immer mit den zugehörigen Nachweisen.</text>

  <circle cx="92" cy="710" r="32" fill="#0f766e"/><text x="92" y="718" class="num">6</text>
  <rect x="150" y="660" width="990" height="100" rx="24" class="action-card"/>
  <text x="185" y="697" class="head">Folgeentscheidung</text>
  <text x="185" y="732" class="body">Öffnen Sie Details, erstellen Sie eine Review-Aktion oder ein PM-Dokument.</text>

  <line x1="92" y1="209" x2="92" y2="244" class="flow"/>
  <line x1="92" y1="314" x2="92" y2="349" class="flow"/>
  <line x1="92" y1="419" x2="92" y2="454" class="flow"/>
  <line x1="92" y1="524" x2="92" y2="559" class="flow"/>
  <line x1="92" y1="629" x2="92" y2="674" class="flow"/>
  <line x1="92" y1="748" x2="92" y2="796" class="flow"/>

  <rect x="150" y="820" width="990" height="92" rx="26" fill="#14532d" filter="url(#shadow)"/>
  <text x="645" y="860" class="final">Ein Ausreißer ist eine Review-Priorität, keine automatische Schlussfolgerung</text>
  <text x="645" y="890" class="final-sub">Die Entscheidung hängt von Nachweisen, Projektkontext und menschlicher Validierung ab.</text>
</svg>
