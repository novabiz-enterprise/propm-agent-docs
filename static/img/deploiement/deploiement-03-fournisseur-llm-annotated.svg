  <g transform="translate(1150 180)"><rect class="card" width="560" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">1</text><text class="head" x="78" y="40">LLM Provider field</text><text class="body" x="78" y="68">Open the list before entering provider details.</text></g>
  <g transform="translate(1150 328)"><rect class="card" width="560" height="112" rx="20"/><circle class="badge" cx="40" cy="56" r="24"/><text class="num" x="40" y="64">2</text><text class="head" x="78" y="42">Provider options</text><text class="body" x="78" y="70">Azure OpenAI, OpenAI, compatible endpoint, or OpenRouter.</text></g>
  <g transform="translate(1150 480)"><rect class="card" width="560" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">3</text><text class="head" x="78" y="40">Finish runtime settings</text><text class="body" x="78" y="68">Confirm credentials and VNet CIDR before review.</text></g>
