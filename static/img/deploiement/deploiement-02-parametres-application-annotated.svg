  <g transform="translate(1160 100)"><rect class="card" width="560" height="92" rx="20"/><circle class="badge" cx="40" cy="46" r="24"/><text class="num" x="40" y="54">1</text><text class="head" x="78" y="36">Environment name</text><text class="body" x="78" y="64">Use a short runtime name such as dev or prod.</text></g>
  <g transform="translate(1160 220)"><rect class="card" width="560" height="92" rx="20"/><circle class="badge" cx="40" cy="46" r="24"/><text class="num" x="40" y="54">2</text><text class="head" x="78" y="36">Installation mode</text><text class="body" x="78" y="64">Choose new install or attach existing resources.</text></g>
  <g transform="translate(1160 340)"><rect class="card" width="560" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">3</text><text class="head" x="78" y="40">Admin access</text><text class="body" x="78" y="68">Enter Entra admin groups and bootstrap users.</text></g>
  <g transform="translate(1160 468)"><rect class="card" width="560" height="92" rx="20"/><circle class="badge" cx="40" cy="46" r="24"/><text class="num" x="40" y="54">4</text><text class="head" x="78" y="36">LLM provider</text><text class="body" x="78" y="64">Select the AI provider family for the instance.</text></g>
  <g transform="translate(1160 588)"><rect class="card" width="560" height="92" rx="20"/><circle class="badge" cx="40" cy="46" r="24"/><text class="num" x="40" y="54">5</text><text class="head" x="78" y="36">Monitoring</text><text class="body" x="78" y="64">Enable alerting; keep debug logs controlled.</text></g>
  <g transform="translate(1160 708)"><rect class="card" width="560" height="92" rx="20"/><circle class="badge" cx="40" cy="46" r="24"/><text class="num" x="40" y="54">6</text><text class="head" x="78" y="36">Credentials and network</text><text class="body" x="78" y="64">Confirm password and VNet CIDR before review.</text></g>
