  <g transform="translate(1160 250)"><rect class="card" width="540" height="96" rx="20"/><circle class="badge" cx="40" cy="48" r="24"/><text class="num" x="40" y="56">2</text><text class="head" x="78" y="38">Deployment region</text><text class="body" x="78" y="66">Keep the Marketplace instance in the target region.</text></g>
  <g transform="translate(1160 380)"><rect class="card" width="540" height="108" rx="20"/><circle class="badge" cx="40" cy="54" r="24"/><text class="num" x="40" y="62">3</text><text class="head" x="78" y="42">Managed application names</text><text class="body" x="78" y="70">Name the app and the managed resource group.</text></g>
  <g transform="translate(1160 540)"><rect class="card" width="540" height="96" rx="20"/><circle class="badge" cx="40" cy="48" r="24"/><text class="num" x="40" y="56">4</text><text class="head" x="78" y="38">Review before create</text><text class="body" x="78" y="66">Validate basics before moving to final creation.</text></g>
