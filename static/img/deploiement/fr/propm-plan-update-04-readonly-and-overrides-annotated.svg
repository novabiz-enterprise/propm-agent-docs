<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="907" viewBox="0 0 1920 907" role="img" aria-labelledby="title desc">
  <title id="title">Annotated cutover lock and overrides</title>
  <desc id="desc">Callouts identify optional override fields, the cutover lock checkbox, admin group fields, and the LLM provider field.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="flowArrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 Z" fill="#60a5fa"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/></filter>
    <style>.focus{fill:#2563eb;fill-opacity:.10;stroke:#2563eb;stroke-width:4;stroke-dasharray:12 8}.arrow{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#arrow)}.card{fill:#0f172a;fill-opacity:.94;stroke:#93c5fd;stroke-width:2;filter:url(#shadow)}.badge{fill:#2563eb}.num{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle}.head{font:700 22px Arial,sans-serif;fill:#fff}.body{font:400 17px Arial,sans-serif;fill:#e2e8f0}.flow{fill:none;stroke:#60a5fa;stroke-width:5;stroke-linecap:round;marker-end:url(#flowArrow);opacity:1}</style>
  </defs>
  <image href="/propm-agent-docs/img/deploiement/fr/propm-plan-update-04-readonly-and-overrides.png" xlink:href="/propm-agent-docs/img/deploiement/fr/propm-plan-update-04-readonly-and-overrides.png" x="0" y="0" width="1920" height="907"/>
  <rect class="focus" x="344" y="238" width="560" height="235" rx="12"/>
  <rect class="focus" x="344" y="512" width="42" height="42" rx="8"/>
  <rect class="focus" x="344" y="650" width="560" height="70" rx="10"/>
  <rect class="focus" x="344" y="760" width="560" height="42" rx="8"/>
  <path class="arrow" d="M1160 240 C1030 260 980 350 904 360"/>
  <path class="arrow" d="M1160 392 C940 405 610 506 386 532"/>
  <path class="arrow" d="M1160 542 C1040 575 980 675 904 684"/>
  <path class="arrow" d="M1160 682 C1050 715 980 770 904 782"/>
  <path class="flow" d="M1765 310 L1765 346"/>
  <path class="flow" d="M1765 470 L1765 506"/>
  <path class="flow" d="M1765 616 L1765 646"/>
  <g transform="translate(1160 190)"><rect class="card" width="570" height="118" rx="20"/><circle class="badge" cx="40" cy="59" r="24"/><text class="num" x="40" y="67">1</text><text class="head" x="78" y="44">Override fields</text><text class="body" x="78" y="72">Fill only when previous resources</text><text class="body" x="78" y="95">used non-standard names.</text></g>
  <g transform="translate(1160 350)"><rect class="card" width="570" height="118" rx="20"/><circle class="badge" cx="40" cy="59" r="24"/><text class="num" x="40" y="67">2</text><text class="head" x="78" y="44">Cutover lock</text><text class="body" x="78" y="72">Block writes on the previous deployment</text><text class="body" x="78" y="95">while the new one is validated.</text></g>
  <g transform="translate(1160 510)"><rect class="card" width="570" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">3</text><text class="head" x="78" y="40">Admin access</text><text class="body" x="78" y="68">Reconfirm platform admin groups.</text></g>
  <g transform="translate(1160 650)"><rect class="card" width="570" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">4</text><text class="head" x="78" y="40">Provider setup continues</text><text class="body" x="78" y="68">Complete LLM provider fields before review.</text></g>
</svg>
