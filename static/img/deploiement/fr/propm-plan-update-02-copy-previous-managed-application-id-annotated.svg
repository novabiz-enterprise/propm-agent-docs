<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="907" viewBox="0 0 1920 907" role="img" aria-labelledby="title desc">
  <title id="title">Annotated previous managed application resource ID copy</title>
  <desc id="desc">Callouts identify where to open Properties and copy the previous managed application Resource ID.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="flowArrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 Z" fill="#60a5fa"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/></filter>
    <style>.focus{fill:#2563eb;fill-opacity:.10;stroke:#2563eb;stroke-width:4;stroke-dasharray:12 8}.arrow{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#arrow)}.card{fill:#0f172a;fill-opacity:.94;stroke:#93c5fd;stroke-width:2;filter:url(#shadow)}.badge{fill:#2563eb}.num{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle}.head{font:700 22px Arial,sans-serif;fill:#fff}.body{font:400 17px Arial,sans-serif;fill:#e2e8f0}.flow{fill:none;stroke:#60a5fa;stroke-width:5;stroke-linecap:round;marker-end:url(#flowArrow);opacity:1}</style>
  </defs>
  <image href="/propm-agent-docs/img/deploiement/fr/propm-plan-update-02-copy-previous-managed-application-id.png" xlink:href="/propm-agent-docs/img/deploiement/fr/propm-plan-update-02-copy-previous-managed-application-id.png" x="0" y="0" width="1920" height="907"/>
  <rect class="focus" x="54" y="571" width="278" height="44" rx="8"/>
  <rect class="focus" x="400" y="288" width="720" height="48" rx="8"/>
  <rect class="focus" x="1040" y="286" width="64" height="50" rx="10"/>
  <path class="arrow" d="M1165 190 C900 220 520 400 332 592"/>
  <path class="arrow" d="M1165 345 C1060 318 950 306 780 310"/>
  <path class="arrow" d="M1165 495 C1120 430 1100 350 1080 312"/>
  <path class="flow" d="M1760 246 L1760 296"/>
  <path class="flow" d="M1760 406 L1760 451"/>
  <g transform="translate(1165 140)"><rect class="card" width="560" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">1</text><text class="head" x="78" y="40">Open Properties</text><text class="body" x="78" y="68">Use the previous Managed Application page.</text></g>
  <g transform="translate(1165 300)"><rect class="card" width="560" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">2</text><text class="head" x="78" y="40">Copy Resource ID</text><text class="body" x="78" y="68">Copy the full Id value, not the display name.</text></g>
  <g transform="translate(1165 455)"><rect class="card" width="560" height="116" rx="20"/><circle class="badge" cx="40" cy="58" r="24"/><text class="num" x="40" y="66">3</text><text class="head" x="78" y="44">Paste into new deployment</text><text class="body" x="78" y="72">Use it in Previous ProPM Managed</text><text class="body" x="78" y="96">Application resource ID.</text></g>
</svg>
