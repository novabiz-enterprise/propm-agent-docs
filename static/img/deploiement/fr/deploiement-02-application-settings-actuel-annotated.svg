<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="864" viewBox="0 0 1920 864" role="img" aria-labelledby="title desc">
  <title id="title">Annotated current application settings</title>
  <desc id="desc">Callouts identify filled administration groups, checkboxes, LLM provider, passwords, and VNet CIDR.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="flowArrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 Z" fill="#60a5fa"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/></filter>
    <style>.focus{fill:#2563eb;fill-opacity:.10;stroke:#2563eb;stroke-width:4;stroke-dasharray:12 8}.arrow{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#arrow)}.card{fill:#0f172a;fill-opacity:.94;stroke:#93c5fd;stroke-width:2;filter:url(#shadow)}.badge{fill:#2563eb}.num{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle}.head{font:700 22px Arial,sans-serif;fill:#fff}.body{font:400 17px Arial,sans-serif;fill:#e2e8f0}.flow{fill:none;stroke:#60a5fa;stroke-width:5;stroke-linecap:round;marker-end:url(#flowArrow);opacity:1}</style>
  </defs>
  <image href="/propm-agent-docs/img/deploiement/fr/deploiement-02-application-settings-actuel.png" xlink:href="/propm-agent-docs/img/deploiement/fr/deploiement-02-application-settings-actuel.png" x="0" y="0" width="1920" height="864"/>
  <rect class="focus" x="344" y="220" width="560" height="40" rx="8"/>
  <rect class="focus" x="344" y="366" width="42" height="42" rx="8"/>
  <rect class="focus" x="344" y="414" width="560" height="42" rx="8"/>
  <rect class="focus" x="344" y="614" width="560" height="92" rx="10"/>
  <rect class="focus" x="344" y="714" width="560" height="42" rx="8"/>
  <path class="arrow" d="M1150 208 C1000 196 955 220 904 240"/>
  <path class="arrow" d="M1150 348 C980 348 620 380 386 386"/>
  <path class="arrow" d="M1150 468 C1040 450 968 434 906 434"/>
  <path class="arrow" d="M1150 596 C1000 610 940 654 906 660"/>
  <path class="arrow" d="M1150 720 C1040 730 970 738 906 736"/>
  <path class="flow" d="M1745 258 L1745 296"/>
  <path class="flow" d="M1745 398 L1745 436"/>
  <path class="flow" d="M1745 538 L1745 576"/>
  <path class="flow" d="M1745 678 L1745 704"/>
  <g transform="translate(1150 160)"><rect class="card" width="560" height="96" rx="20"/><circle class="badge" cx="40" cy="48" r="24"/><text class="num" x="40" y="56">1</text><text class="head" x="78" y="38">Admin group IDs</text><text class="body" x="78" y="66">Use Entra Object IDs for platform administrators.</text></g>
  <g transform="translate(1150 300)"><rect class="card" width="560" height="96" rx="20"/><circle class="badge" cx="40" cy="48" r="24"/><text class="num" x="40" y="56">2</text><text class="head" x="78" y="38">Recovery and monitoring</text><text class="body" x="78" y="66">Keep required checkboxes intentional.</text></g>
  <g transform="translate(1150 440)"><rect class="card" width="560" height="96" rx="20"/><circle class="badge" cx="40" cy="48" r="24"/><text class="num" x="40" y="56">3</text><text class="head" x="78" y="38">LLM provider</text><text class="body" x="78" y="66">Select the provider family before final review.</text></g>
  <g transform="translate(1150 580)"><rect class="card" width="560" height="96" rx="20"/><circle class="badge" cx="40" cy="48" r="24"/><text class="num" x="40" y="56">4</text><text class="head" x="78" y="38">Password confirmation</text><text class="body" x="78" y="66">Both password fields must validate.</text></g>
  <g transform="translate(1150 708)"><rect class="card" width="560" height="96" rx="20"/><circle class="badge" cx="40" cy="48" r="24"/><text class="num" x="40" y="56">5</text><text class="head" x="78" y="38">Network CIDR</text><text class="body" x="78" y="66">Reserve a non-conflicting VNet range.</text></g>
