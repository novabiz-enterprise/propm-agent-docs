  <g transform="translate(1160 180)"><rect class="card" width="570" height="106" rx="20"/><circle class="badge" cx="40" cy="53" r="24"/><text class="num" x="40" y="61">1</text><text class="head" x="78" y="41">Attach existing data</text><text class="body" x="78" y="69">Select this mode for a plan update cutover.</text></g>
  <g transform="translate(1160 340)"><rect class="card" width="570" height="118" rx="20"/><circle class="badge" cx="40" cy="59" r="24"/><text class="num" x="40" y="67">2</text><text class="head" x="78" y="44">Previous application ID</text><text class="body" x="78" y="72">Paste the Resource ID copied from</text><text class="body" x="78" y="95">the previous managed application.</text></g>
  <g transform="translate(1160 520)"><rect class="card" width="570" height="118" rx="20"/><circle class="badge" cx="40" cy="59" r="24"/><text class="num" x="40" y="67">3</text><text class="head" x="78" y="44">Optional overrides</text><text class="body" x="78" y="72">Leave empty unless custom resource</text><text class="body" x="78" y="95">names were used before.</text></g>
