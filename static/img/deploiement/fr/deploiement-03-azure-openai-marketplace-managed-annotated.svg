<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="861" viewBox="0 0 1920 861" role="img" aria-labelledby="title desc">
  <title id="title">Annotated Azure OpenAI provider selection</title>
  <desc id="desc">Callouts identify the LLM provider dropdown, Azure OpenAI selection, and the post-deployment configuration reminder.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="flowArrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 Z" fill="#60a5fa"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/></filter>
    <style>.focus{fill:#2563eb;fill-opacity:.10;stroke:#2563eb;stroke-width:4;stroke-dasharray:12 8}.arrow{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#arrow)}.card{fill:#0f172a;fill-opacity:.94;stroke:#93c5fd;stroke-width:2;filter:url(#shadow)}.badge{fill:#2563eb}.num{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle}.head{font:700 22px Arial,sans-serif;fill:#fff}.body{font:400 17px Arial,sans-serif;fill:#e2e8f0}.flow{fill:none;stroke:#60a5fa;stroke-width:5;stroke-linecap:round;marker-end:url(#flowArrow);opacity:1}</style>
  </defs>
  <image href="/propm-agent-docs/img/deploiement/fr/deploiement-03-azure-openai-marketplace-managed.png" xlink:href="/propm-agent-docs/img/deploiement/fr/deploiement-03-azure-openai-marketplace-managed.png" x="0" y="0" width="1920" height="861"/>
  <rect class="focus" x="348" y="450" width="570" height="42" rx="8"/>
  <rect class="focus" x="348" y="492" width="570" height="178" rx="8"/>
  <rect class="focus" x="348" y="655" width="570" height="130" rx="10"/>
  <path class="arrow" d="M1150 220 C1028 300 975 438 918 471"/>
  <path class="arrow" d="M1150 360 C1030 420 960 515 918 533"/>
  <path class="arrow" d="M1150 505 C1030 575 970 705 918 724"/>
  <path class="flow" d="M1760 274 L1760 311"/>
  <path class="flow" d="M1760 435 L1760 468"/>
  <g transform="translate(1150 168)"><rect class="card" width="575" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">1</text><text class="head" x="78" y="40">LLM Provider</text><text class="body" x="78" y="68">Open the dropdown in Application Settings.</text></g>
  <g transform="translate(1150 315)"><rect class="card" width="575" height="118" rx="20"/><circle class="badge" cx="40" cy="59" r="24"/><text class="num" x="40" y="67">2</text><text class="head" x="78" y="44">Azure OpenAI option</text><text class="body" x="78" y="72">Marketplace records the provider intent only.</text><text class="body" x="78" y="95">Runtime details are finished later.</text></g>
  <g transform="translate(1150 472)"><rect class="card" width="575" height="118" rx="20"/><circle class="badge" cx="40" cy="59" r="24"/><text class="num" x="40" y="67">3</text><text class="head" x="78" y="44">Complete in administration</text><text class="body" x="78" y="72">Endpoint, API version, auth and LLM</text><text class="body" x="78" y="95">deployment name are configured after install.</text></g>
</svg>
