  <path class="flow" d="M1745 588 L1745 621"/>
  <g transform="translate(1150 160)"><rect class="card" width="560" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">1</text><text class="head" x="78" y="40">New Marketplace deployment</text><text class="body" x="78" y="68">Create a separate deployment for the new plan.</text></g>
  <g transform="translate(1150 315)"><rect class="card" width="560" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">2</text><text class="head" x="78" y="40">Subscription, group, region</text><text class="body" x="78" y="68">Keep target Azure scope explicit.</text></g>
  <g transform="translate(1150 470)"><rect class="card" width="560" height="116" rx="20"/><circle class="badge" cx="40" cy="58" r="24"/><text class="num" x="40" y="66">3</text><text class="head" x="78" y="44">Use new names</text><text class="body" x="78" y="72">Different app and managed group names</text><text class="body" x="78" y="96">avoid confusion during cutover.</text></g>
  <g transform="translate(1150 625)"><rect class="card" width="560" height="104" rx="20"/><circle class="badge" cx="40" cy="52" r="24"/><text class="num" x="40" y="60">4</text><text class="head" x="78" y="40">Review and create</text><text class="body" x="78" y="68">Only after all Basics fields are valid.</text></g>
</svg>
