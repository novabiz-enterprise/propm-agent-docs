<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="906" viewBox="0 0 1920 906" role="img" aria-labelledby="title desc">
  <title id="title">Annotated plan update new deployment basics</title>
  <desc id="desc">Callouts organize the fields used to create a new ProPM deployment for a plan update.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="flowArrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 Z" fill="#60a5fa"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/></filter>
    <style>.focus{fill:#2563eb;fill-opacity:.10;stroke:#2563eb;stroke-width:4;stroke-dasharray:12 8}.arrow{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#arrow)}.card{fill:#0f172a;fill-opacity:.94;stroke:#93c5fd;stroke-width:2;filter:url(#shadow)}.badge{fill:#2563eb}.num{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle}.head{font:700 22px Arial,sans-serif;fill:#fff}.body{font:400 17px Arial,sans-serif;fill:#e2e8f0}.flow{fill:none;stroke:#60a5fa;stroke-width:5;stroke-linecap:round;marker-end:url(#flowArrow);opacity:1}</style>
  </defs>
  <image href="/propm-agent-docs/img/deploiement/fr/propm-plan-update-01-new-deployment-basics.png" xlink:href="/propm-agent-docs/img/deploiement/fr/propm-plan-update-01-new-deployment-basics.png" x="0" y="0" width="1920" height="906"/>
  <rect class="focus" x="344" y="363" width="560" height="92" rx="10"/>
  <rect class="focus" x="344" y="526" width="560" height="42" rx="8"/>
  <rect class="focus" x="344" y="688" width="560" height="92" rx="10"/>
  <rect class="focus" x="258" y="860" width="178" height="36" rx="8"/>
  <path class="arrow" d="M1150 210 C1030 265 970 378 904 407"/>
  <path class="arrow" d="M1150 360 C1045 414 980 518 904 548"/>
  <path class="arrow" d="M1150 510 C1040 598 980 720 904 736"/>
  <path class="arrow" d="M1150 662 C965 762 635 850 438 878"/>
